<svg xmlns="http://www.w3.org/2000/svg" width="400" height="88" viewBox="0 0 400 88" role="img" aria-label="Hypergate: one secure gateway for every MCP server">
  <defs>
    <linearGradient id="ring" x1="0.08" y1="0.05" x2="0.92" y2="0.95">
      <stop offset="0" stop-color="#7c6bff"/><stop offset="0.3" stop-color="#6d5efc"/>
      <stop offset="0.6" stop-color="#22d3ee"/><stop offset="0.8" stop-color="#a5f3fc"/>
      <stop offset="1" stop-color="#6d5efc"/>
    </linearGradient>
    <radialGradient id="feather">
      <stop offset="0.46" stop-color="#fff" stop-opacity="0"/><stop offset="0.58" stop-color="#fff" stop-opacity="0.5"/>
      <stop offset="0.7" stop-color="#fff" stop-opacity="1"/><stop offset="0.86" stop-color="#fff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gate" maskContentUnits="userSpaceOnUse"><circle cx="44" cy="44" r="30" fill="url(#feather)"/></mask>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c6bff" stop-opacity="0.7"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.1" cy="0.5" r="0.6"><stop offset="0" stop-color="#6d5efc" stop-opacity="0.28"/><stop offset="1" stop-color="#6d5efc" stop-opacity="0"/></radialGradient>
  </defs>
  <rect x="1" y="1" width="398" height="86" rx="20" fill="#05060f"/>
  <rect x="1" y="1" width="398" height="86" rx="20" fill="url(#glow)"/>
  <rect x="1" y="1" width="398" height="86" rx="20" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
  <circle cx="44" cy="44" r="30" fill="url(#ring)" mask="url(#gate)">
    <animateTransform attributeName="transform" type="rotate" from="0 44 44" to="360 44 44" dur="12s" repeatCount="indefinite"/>
  </circle>
  <text x="88" y="40" fill="#f4f4ff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="0.2">Hypergate</text>
  <text x="88" y="62" fill="#a5b4d8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5">One secure gateway for every MCP server</text>
  <text x="380" y="40" text-anchor="end" fill="#22d3ee" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11">hypergate.app ↗</text>
</svg>
